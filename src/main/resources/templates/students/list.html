<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>학생 목록</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand"
           th:href="@{/}">
            Mentor Pairing
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <h1 class="h2 mb-0">학생 목록</h1>

        <a class="btn btn-primary"
           th:href="@{/students/new}">
            학생 등록
        </a>
    </div>

    <div class="alert alert-success"
         th:if="${param.profileSuccess}">
        학생 프로필이 정상적으로 등록되었습니다.
    </div>

    <div class="alert alert-success"
         th:if="${param.scoreSuccess}">
        학생 성적이 정상적으로 등록되었습니다.
    </div>

    <!-- 등록된 학생이 없는 경우 -->
    <div class="alert alert-secondary"
         th:if="${#lists.isEmpty(students)}">

        등록된 학생이 없습니다.

        <a th:href="@{/students/new}"
           class="alert-link">
            학생을 등록해주세요.
        </a>
    </div>

    <!-- 등록된 학생이 있는 경우 -->
    <div class="card"
         th:unless="${#lists.isEmpty(students)}">

        <div class="table-responsive">

            <table class="table table-striped
                          table-hover mb-0">

                <thead class="table-dark">
                <tr>
                    <th>번호</th>
                    <th>학번</th>
                    <th>이름</th>
                    <th>관리</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="student, status : ${students}">

                    <td th:text="${status.count}">
                        1
                    </td>

                    <td th:text="${student.studentId}">
                        10001
                    </td>

                    <td th:text="${student.name}">
                        이용균
                    </td>

                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/student-profiles/new(studentId=${student.studentId})}">
                            프로필 등록
                        </a>
                        <a class="btn btn-sm btn-outline-success"
                           th:href="@{/score-reports/new(studentId=${student.studentId})}">
                            성적 등록
                        </a>
                        <a class="btn btn-sm btn-outline-dark"
                           th:href="@{/applications/new(studentId=${student.studentId})}">
                            멘토링 신청
                        </a>
                    </td>


                </tr>
                </tbody>

            </table>

        </div>
    </div>

    <div class="mt-4">
        <a class="btn btn-outline-secondary"
           th:href="@{/}">
            홈으로
        </a>
    </div>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
