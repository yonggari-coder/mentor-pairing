<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>학생 프로필 등록</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand"
           th:href="@{/}">
            Mentor Pairing
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="mx-auto" style="max-width: 600px">

        <h1 class="h2 mb-4">학생 프로필 등록</h1>

        <form th:action="@{/student-profiles}"
              th:object="${form}"
              method="post"
              class="card">

            <div class="card-body">

                <div class="mb-3">
                    <label for="studentId"
                           class="form-label">
                        학번
                    </label>

                    <input id="studentId"
                           type="number"
                           class="form-control"
                           th:field="*{studentId}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label for="birthDate"
                           class="form-label">
                        생년월일
                    </label>

                    <input id="birthDate"
                           type="date"
                           class="form-control"
                           th:field="*{birthDate}"
                           required>
                </div>

            </div>

            <div class="card-footer d-flex justify-content-between">

                <a class="btn btn-outline-secondary"
                   th:href="@{/students}">
                    취소
                </a>

                <button type="submit"
                        class="btn btn-primary">
                    프로필 등록
                </button>

            </div>

        </form>

    </div>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
