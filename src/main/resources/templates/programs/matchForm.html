<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>멘토링 매칭</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand"
           th:href="@{/}">
            Mentor Pairing
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="mx-auto"
         style="max-width: 720px">

        <div class="d-flex justify-content-between
                    align-items-center mb-4">

            <h1 class="h2 mb-0">
                멘토링 매칭
            </h1>

            <a class="btn btn-outline-secondary"
               th:href="@{/applications}">
                신청 목록
            </a>
        </div>

        <!-- 1단계: 멘티 선택 -->
        <div class="card mb-4">

            <div class="card-header fw-bold">
                1단계: 멘티 선택
            </div>

            <div class="card-body">

                <!-- 대기 중인 멘티가 없는 경우 -->
                <div class="alert alert-secondary mb-0"
                     th:if="${#lists.isEmpty(mentees)}">

                    매칭 대기 중인 멘티가 없습니다.

                    <a class="alert-link"
                       th:href="@{/applications/new}">
                        멘토링 신청하기
                    </a>
                </div>

                <!-- 대기 중인 멘티가 있는 경우 -->
                <form th:unless="${#lists.isEmpty(mentees)}"
                      th:action="@{/programs/match}"
                      method="get">

                    <div class="mb-3">

                        <label for="selectedMenteeId"
                               class="form-label">
                            매칭할 멘티
                        </label>

                        <select id="selectedMenteeId"
                                name="menteeApplicationId"
                                class="form-select"
                                required>

                            <option value="">
                                멘티를 선택하세요
                            </option>

                            <option th:each="menteeApp : ${mentees}"
                                    th:value="${menteeApp.applicationId}"
                                    th:selected="${selectedMentee != null
                                        and selectedMentee.applicationId
                                        == menteeApp.applicationId}"
                                    th:text="|${menteeApp.applicant.name}
                                        (${menteeApp.applicant.studentId})
                                        - ${menteeApp.subject}|">
                            </option>

                        </select>
                    </div>

                    <button type="submit"
                            class="btn btn-primary">
                        멘토 후보 조회
                    </button>

                </form>

            </div>
        </div>

        <!-- 2단계: 멘토 선택 -->
        <!-- selectedMentee가 있을 때만 표시 -->
        <div class="card"
             th:if="${selectedMentee != null}">

            <div class="card-header fw-bold">
                2단계: 멘토 선택
            </div>

            <div class="card-body">

                <!-- 선택한 멘티 정보 -->
                <div class="alert alert-light border">

                    <div class="mb-1">
                        선택한 멘티
                    </div>

                    <strong th:text="${selectedMentee.applicant.name}">
                        이용균
                    </strong>

                    <span class="text-secondary"
                          th:text="|(${selectedMentee.applicant.studentId})|">
                        (10001)
                    </span>

                    <span class="badge text-bg-primary ms-2"
                          th:text="${selectedMentee.subject}">
                        MATH
                    </span>

                </div>

                <!-- 멘토 후보가 없는 경우 -->
                <div class="alert alert-warning mb-0"
                     th:if="${#lists.isEmpty(mentors)}">

                    선택한 과목에 매칭 가능한 멘토가 없습니다.

                    <a class="alert-link"
                       th:href="@{/applications/new}">
                        멘토 신청 등록하기
                    </a>

                </div>

                <!-- 멘토 후보가 있는 경우 -->
                <form th:unless="${#lists.isEmpty(mentors)}"
                      th:action="@{/programs/match}"
                      method="post">

                    <!-- 선택한 멘티 신청 ID -->
                    <input type="hidden"
                           name="menteeApplicationId"
                           th:value="${selectedMentee.applicationId}">

                    <div class="mb-3">

                        <label for="mentorApplicationId"
                               class="form-label">
                            매칭할 멘토
                        </label>

                        <select id="mentorApplicationId"
                                name="mentorApplicationId"
                                class="form-select"
                                required>

                            <option value="">
                                멘토를 선택하세요
                            </option>

                            <option th:each="mentorApp : ${mentors}"
                                    th:value="${mentorApp.applicationId}"
                                    th:text="|${mentorApp.applicant.name}
                                        (${mentorApp.applicant.studentId})
                                        - ${mentorApp.subject}|">
                            </option>

                        </select>
                    </div>

                    <div class="d-flex justify-content-between">

                        <a class="btn btn-outline-secondary"
                           th:href="@{/programs/match}">
                            멘티 다시 선택
                        </a>

                        <button type="submit"
                                class="btn btn-dark">
                            멘토링 매칭
                        </button>

                    </div>

                </form>

            </div>
        </div>

        <div class="mt-4">

            <a class="btn btn-outline-secondary"
               th:href="@{/}">
                홈으로
            </a>

            <a class="btn btn-outline-dark"
               th:href="@{/programs}">
                프로그램 목록
            </a>

        </div>

    </div>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
