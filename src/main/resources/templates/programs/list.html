<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>멘토링 프로그램 목록</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand"
           th:href="@{/}">
            Mentor Pairing
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <h1 class="h2 mb-0">멘토링 프로그램 목록</h1>

        <a class="btn btn-dark"
           th:href="@{/programs/match}">
            새 매칭
        </a>
    </div>

    <div class="alert alert-success"
         th:if="${param.matchSuccess}">
        멘토링 매칭이 완료되었습니다.
    </div>

    <div class="alert alert-success"
         th:if="${param.endSuccess}">
        멘토링 프로그램이 종료되었습니다.
    </div>

    <div class="alert alert-secondary"
         th:if="${#lists.isEmpty(programs)}">
        생성된 멘토링 프로그램이 없습니다.
    </div>

    <div class="card"
         th:unless="${#lists.isEmpty(programs)}">

        <div class="table-responsive">

            <table class="table table-striped table-hover mb-0">

                <thead class="table-dark">
                <tr>
                    <th>프로그램 ID</th>
                    <th>멘티 학번</th>
                    <th>멘티 이름</th>
                    <th>멘토 학번</th>
                    <th>멘토 이름</th>
                    <th>상태</th>
                    <th>종료일</th>
                    <th>관리</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="program : ${programs}">

                    <td th:text="${program.mentoringProgramId}">
                        1
                    </td>

                    <td th:text="${program.mentee.studentId}">
                        10001
                    </td>

                    <td th:text="${program.mentee.name}">
                        이용균
                    </td>

                    <td th:text="${program.mentor.studentId}">
                        10002
                    </td>

                    <td th:text="${program.mentor.name}">
                        양승원
                    </td>
                    <td th:text="${program.mentoringStatus}">
                        ACTIVE
                    </td>

                    <td th:text="${program.endedAt != null? #temporals.format(program.endedAt, 'yyyy-MM-dd HH:mm'): '-'}">-</td>
                    <td>
                        <form th:if="${program.mentoringStatus.name() == 'ACTIVE'}"
                              th:action="@{/programs/{id}/end(id=${program.mentoringProgramId})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('멘토링을 종료하시겠습니까?')">
                                종료
                            </button>
                        </form>

                        <span th:if="${program.mentoringStatus.name() == 'ENDED'}" class="text-muted">종료됨</span>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

    <div class="mt-4">
        <a class="btn btn-outline-secondary"
           th:href="@{/}">
            홈으로
        </a>
    </div>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
